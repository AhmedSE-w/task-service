openapi: 3.0.3
info:
  title: Task Service
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: The service is running

  /v1/tasks:
    post:
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: The task was created
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid api key
    get:
      summary: List tasks
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: assignee_id, in: query, schema: {type: string}}
        - {name: project_id, in: query, schema: {type: string}}
        - {name: item_type, in: query, schema: {type: string}}
        - {name: item_id, in: query, schema: {type: string}}
      responses:
        '200':
          description: The matching tasks

  /v1/tasks/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Get a task
      responses:
        '200':
          description: The task
        '404':
          description: Task not found
    patch:
      summary: Update title, priority or due date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string}
                priority: {type: string, enum: [low, medium, high, urgent]}
                due_date: {type: string, format: date}
      responses:
        '200':
          description: The updated task
        '404':
          description: Task not found

  /v1/tasks/{id}/events:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Task history
      responses:
        '200':
          description: The events of the task, oldest first
        '404':
          description: Task not found

  /v1/tasks/{id}/comments:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: List comments
      responses:
        '200':
          description: The comments of the task, oldest first
        '404':
          description: Task not found
    post:
      summary: Add a comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, example: 'The location is wrong, check the map'}
      responses:
        '201':
          description: The comment was created
        '404':
          description: Task not found

  /v1/tasks/{id}/transition:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Move a task to anther status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: {type: string, example: in_progress}
                reason: {type: string, example: The location is wrong}
      responses:
        '200':
          description: The task in its new status
        '400':
          description: The move is not allowed by the workflow
        '403':
          description: The user may not make this move
        '404':
          description: Task not found

  /v1/tasks/{id}/assign:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Assign a task to a user (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee_id]
              properties:
                assignee_id: {type: string, example: hisham}
      responses:
        '200':
          description: The task with its new assignee
        '403':
          description: Only a manager can assign tasks
        '404':
          description: Task not found

  /v1/tasks/{id}/items/{itemId}/decision:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Approve or reject one item in a batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, rejected]}
                reason: {type: string, example: The name is wrong}
      responses:
        '200':
          description: The item with its decision
        '400':
          description: Not a batch task, not in progress, or a rejection without a reason
        '403':
          description: Only the assignee can decide items
        '404':
          description: Task or item not found

  /v1/projects:
    post:
      summary: Create a project (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, example: Riyadh pharmacies verification}
                description: {type: string}
                owner_id: {type: string, example: sara}
                start_date: {type: string, format: date}
                due_date: {type: string, format: date}
      responses:
        '201':
          description: The project was created
        '403':
          description: Only a manager can create a project
    get:
      summary: List projects
      responses:
        '200':
          description: The projects of this client

  /v1/projects/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a project with progress counts
      responses:
        '200':
          description: The project, with the number of its tasks in each status
        '404':
          description: Project not found
    patch:
      summary: Update or close a project (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                description: {type: string}
                owner_id: {type: string}
                start_date: {type: string, format: date}
                due_date: {type: string, format: date}
                status: {type: string, enum: [open, closed]}

      responses:
        '200':
          description: The updated project
        '403':
          description: Only a manager can update a project
        '404':
          description: Project not found

  /v1/projects/{id}/assign:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Split a project's unassigned tasks across users by percentage (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [splits]
              properties:
                splits:
                  type: array
                  items:
                    type: object
                    required: [user_id, percent]
                    properties:
                      user_id: {type: string, example: hisham}
                      percent: {type: integer, minimum: 1, maximum: 100, example: 50}
      responses:
        '200':
          description: How many tasks each user got
        '400':
          description: The percentages do not add up to 100
        '403':
          description: Only a manager can split tasks
        '404':
          description: Project not found

  /v1/workflows:
    post:
      summary: Create a workflow (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, statuses, transitions]
              properties:
                name: {type: string, example: Review only}
                statuses:
                  type: array
                  items: {type: string}
                  example: [in_review, done]
                transitions:
                  type: array
                  items:
                    type: object
                    required: [from, to, by]
                    properties:
                      from: {type: string, example: in_review}
                      to: {type: string, example: done}
                      by: {type: array, items: {type: string}, example: [reviewer]}
      responses:
        '201':
          description: The workflow was created
        '400':
          description: Invalid input
        '403':
          description: Only an admin can create a workflow
components:
  schemas:
    TaskInput:
      type: object
      required: [task_type, title, target]
      properties:
        task_type: {type: string, example: verify_poi}
        title: {type: string, example: Verify Nahdi Olaya branch}
        priority: {type: string, enum: ['low', 'medium', 'high', 'urgent']}
        target:
          type: object
          required: [kind, items]
          properties:
            kind: {type: string, enum: [item, batch]}
            items:
              type: array
              minItems: 1
              items:
                type: object
                required: [type, id]
                properties:
                  type: {type: string, example: poi}
                  id: {type: string, example: '12345'}
        assignee_id: {type: string, example: hisham}
        reviewer_id: {type: string, example: faisal}
        project_id: {type: string, format: uuid}
        due_date: {type: string, format: date}
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
    UserId:
      type: apiKey
      in: header
      name: x-user-id
    UserRole:
      type: apiKey
      in: header
      name: x-user-role
security:
  - ApiKey: []
    UserId: []
    UserRole: []
