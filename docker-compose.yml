services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: task_service
      POSTGRES_PASSWORD: task_service
      POSTGRES_DB: task_service
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: task_service
      DB_USER: task_service
      DB_PASSWORD: task_service
    depends_on:
      - db

volumes:
  db-data:
